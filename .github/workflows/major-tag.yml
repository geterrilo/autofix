# Moves the major tag (v1, v2…) to each published release, so that `geterrilo/autofix@v1` follows
# the latest v1.x.y. Prereleases and tags that are not vX.Y.Z are left alone.
name: Move the major tag

on:
  release:
    types: [published]

permissions: {}

jobs:
  major-tag:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Point the major tag at the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v([0-9]+)\.[0-9]+\.[0-9]+$ ]]; then
            echo "::notice::$TAG is not a vX.Y.Z tag: major tag not moved."
            exit 0
          fi
          major="v${BASH_REMATCH[1]}"
          # The commit of the release, also when the release tag is annotated.
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$major" > /dev/null 2>&1; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$major" -f sha="$sha" -F force=true > /dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$major" -f sha="$sha" > /dev/null
          fi
          echo "$major → $TAG ($sha)" >> "$GITHUB_STEP_SUMMARY"
